      default_table_id: item_l3_category_csv
      candidates: [item_l3_category_csv]
      loader: category_folder
      requires_scope: [category_l1, category_l2, category_l3]

replaces:
  - dashboard_top_listing

outputs:
  primary:
    - table_id: top_listing_ranking
      grain: [item_name]
      top_n: 20
