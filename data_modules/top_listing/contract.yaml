schema_version: data_module_v3
module_id: top_listing
module_name: Top Listing 商品样本
module_type: listing
status: active
owner: CateMate
last_updated: "2026-07-15"

source_schema_ref: source_schema.yaml

source_bindings:
  allowed_grains: [item]
  by_grain:
