name: CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_public_repo.py
      - run: python scripts/validate_v3_data_modules.py
      # Full suite needs local CateMate_rawdata; public CI covers fixture + synthetic demo only.
      - run: python -m pytest -q tests/test_public_demo_smoke.py tests/data_modules tests/catemate/scope/test_related.py tests/catemate/scope/test_if_related_e2e.py

  workbench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: CateMate-Workbench
      - run: corepack pnpm run typecheck
        working-directory: CateMate-Workbench
      - run: corepack pnpm --filter @workspace/catemate run build
        working-directory: CateMate-Workbench
        env:
          PORT: 5173
          BASE_PATH: /
