kind = "web"
previewPath = "/"
title = "CateMate 分析工作台"
version = "1.0.0"
id = "artifacts/catemate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19926

[services.development]
run = "pnpm --filter @workspace/catemate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/catemate", "run", "build" ]
serve = "static"
publicDir = "artifacts/catemate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19926"
BASE_PATH = "/"
