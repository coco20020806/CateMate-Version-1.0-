version: 2
processed_root: CateMate_processeddata
source_tables_dir: source_tables
manifest_path: processed_manifest.yaml
default_update_mode: append_merge
tables:
  - table_id: rm_raw_data
    source_workbook_keywords:
      - RM
    source_sheet: Raw data
    output_csv: source_tables/rm_raw_data.csv
    description: RM 月度类目 GMV / Orders raw data。
    primary_keys: []
    important_fields:
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - grass_month
      - gmv_usd
      - orders
    selected_fields:
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - grass_month
      - gmv_usd
      - orders
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_history
    source_workbook_keywords:
      - 2026
    source_sheet: 过去数据
    output_csv: source_tables/dashboard_history.csv
    description: DECK Part 1 使用的市场整体趋势历史数据。
    important_fields:
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - grass_month
      - gmv_usd
      - orders
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_daily_data
    source_workbook_keywords:
      - 2026
    source_sheet: daily data
    output_csv: source_tables/dashboard_daily_data.csv
    description: DECK Part 2 使用的日度 Shopee / CNCB / 广告 / 活动数据。
    important_fields:
      - grass_date
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - shopee_order(SUM)
      - shopee_gmv_usd(SUM)
      - cncb_order(SUM)
      - cncb_gmv_usd(SUM)
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_price_tier
    source_workbook_keywords:
      - 2026
    source_sheet: price tier
    output_csv: source_tables/dashboard_price_tier.csv
    description: DECK Part 3/4 使用的当前期价格段数据。
    important_fields:
      - year_month
      - seller_type
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - Price_Range_USD
      - ADO
      - ADG
      - Live_SKUs
      - Mall_ADO
      - Mall_ADG
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_price_tier_prior
    source_workbook_keywords:
      - 2026
    source_sheet: price tier2
    output_csv: source_tables/dashboard_price_tier2.csv
    description: DECK Part 4 使用的对比期价格段数据。
    important_fields:
      - year_month
      - seller_type
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - Price_Range_USD
      - ADO
      - ADG
      - Live_SKUs
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_top_shop
    source_workbook_keywords:
      - 2026
    source_sheet: top shop
    output_csv: source_tables/dashboard_top_shop.csv
    description: DECK Part 5 使用的 Top Shop 数据。
    important_fields:
      - update_date
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - shop_id
      - shop_link
      - user_name
      - mtd_adgmv_usd(SUM)
      - mtd_ado(SUM)
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_keywords
    source_workbook_keywords:
      - 2026
    source_sheet: keywords
    output_csv: source_tables/dashboard_keywords.csv
    description: DECK Part 6 使用的关键词点击数据。
    important_fields:
      - seller_type
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - keyword
      - keyword_rank(SUM)
      - current_daily_item_click(SUM)
      - benchmark_daily_item_click(SUM)
      - daily_item_click_growth(SUM)
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge

  - table_id: dashboard_top_listing
    source_workbook_keywords:
      - 2026
    source_sheet: 热门商品
    output_csv: source_tables/dashboard_top_listing.csv
    description: DECK Part 7 使用的 Top Listing 商品数据。
    important_fields:
      - item_name
      - item_link
      - item_image
      - grass_region
      - cb_level1_global_be_category
      - level2_global_be_category
      - level3_global_be_category
      - item_price_usd
      - current_ado(RAW)
      - current_adgmv(RAW)
    dedupe_keys:
      - __all_columns__
    update_mode: append_merge
