schema_version: data_module_v2
module_id: dashboard_history_market_trend
module_name: 看板市场历史趋势
module_type: market_trend
status: active
owner: CateMate
last_updated: "2026-07-09"

business_purpose:
  description: 基于品类看板「过去数据」sheet 的市场历史趋势，提供近 12 个月各站点 GMV/Orders/AOV 表现。
  typical_questions:
    - 用户明确提到 DECK Part 1 / Deck Part1 / 过去数据 时的市场历史表现？
    - 近 12 个月各站点 GMV / Orders 趋势如何？
    - 看板口径下某类目在各站点的月度 GMV / Orders 如何？
    - 各站点客单价（AOV）对比如何？
  decision_support:
    - 看板汇报口径的市场趋势解读
    - 近 12 个月站点表现对比
  not_suitable_for:
    - 超过看板历史窗口的超长趋势（优先 rm_monthly_category_performance）
    - 其他 DECK Part（Part 2-7）的需求
    - 日度 CNCB 渗透（请用 dashboard_daily_cncb_performance）

lineage:
  source_workbook_pattern: "*品类数据看板*.xlsx"
  source_workbook_name: 2026 SPH 品类数据看板.xlsx
  formula_sheet: DECK
  source_deck_part: "DECK Part 1"
  source_tables:
    - table_id: dashboard_history
      source_sheet: 过去数据
      processed_table: source_tables/dashboard_history.csv
      role: primary_market_history
      extraction_rule: 从「过去数据」sheet 抽取到 processed CSV（对应 DECK Part 1）
      aggregation_rule: 按 grass_region、类目层级、grass_month 聚合 gmv_usd、orders

data_grain:
  time_grain: monthly
  primary_grain:
    - grass_region
    - grass_month
    - cb_level1_global_be_category
    - level2_global_be_category
    - level3_global_be_category
  category_levels:
    - L1
    - L2
    - L3
  default_filters:
    - category
    - site
    - time_range

fields:
  dimensions:
    - field: grass_region
      meaning: 站点/区域
      role: site
      required: true
    - field: cb_level1_global_be_category
      meaning: 一级类目
      role: category_l1
      required: false
    - field: level2_global_be_category
      meaning: 二级类目
      role: category_l2
      required: false
    - field: level3_global_be_category
      meaning: 三级类目
      role: category_l3
      required: false
    - field: grass_month
      meaning: 月份
      role: time
      required: true
  metrics:
    - field: gmv_usd
      meaning: GMV（美元）
      aggregation: sum
      default_axis: y
      derived: false
      derivation: null
      null_rule: 缺失保持为空
    - field: orders
      meaning: 订单数
      aggregation: sum
      default_axis: y
      derived: false
      derivation: null
      null_rule: 缺失保持为空；为 0 时影响 AOV

derived_metrics:
  - metric_id: aov
    meaning: 客单价
    expression: gmv_usd / orders
    required_fields:
      - gmv_usd
      - orders
    null_rule: orders 为 0 或缺失时 aov 为空

default_charts:
  - chart_intent: market_history_trend
    default_chart_type: trend
    title_template: "{category} 市场历史趋势"
    x_axis: grass_month
    y_axis:
      - gmv_usd
      - orders
    series: grass_region
    dimensions:
      - grass_region
      - grass_month
    sort_rule: time_ascending
    top_n: null
    dedupe_group: monthly_market_trend
    notes:
      - 与 rm_monthly_category_performance 可能重复；同一需求若两者都选中，preview 可降级其中一个
  - chart_intent: category_site_comparison
    default_chart_type: bar
    title_template: "{category} 站点 GMV/Orders 对比"
    x_axis: grass_region
    y_axis:
      - gmv_usd
      - orders
    series: null
    dimensions:
      - grass_region
    sort_rule: metric_desc
    top_n: null
    dedupe_group: null
    notes: []

chart_rules:
  dedupe:
    enabled: true
    dedupe_group: monthly_market_trend
    prefer:
      - longer_time_window
      - table_id:rm_raw_data
  sorting:
    default: time_ascending
    special: {}
  missing_value_policy:
    do_not_fill_null: true
    do_not_invent_yoy: true
    explain_nulls: true

planning_hints:
  explicit_triggers:
    - DECK Part 1
    - Deck Part 1
    - DECK Part1
    - 过去数据
  use_when:
    - 用户明确提到 DECK Part 1 / Deck Part1 / 过去数据（强命中信号）
    - 需要近 12 个月看板历史趋势或看板口径月度 GMV/Orders/AOV
    - 用户问看板市场历史、近 12 个月站点表现
  avoid_when:
    - 用户仅泛泛提到「DECK」但未说明 Part 1（可能对应 Part 2-7 等其他模块）
    - 仅需长时间窗口月度趋势且 rm 模块已覆盖
    - 同一规划中已与 rm_monthly_category_performance 重复匹配月度 trend
  preferred_over: []
  can_combine_with:
    - dashboard_daily_cncb_performance
    - dashboard_price_tier_distribution

limitations:
  - 历史窗口受「过去数据」sheet 限制，通常约近 12 个月，短于 RM 全量历史
  - 与 rm_monthly_category_performance 存在口径重叠，规划时应避免重复选两个做同类 trend
  - 不自动发明 YoY
